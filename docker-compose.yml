services:
  catfish-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catfish-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_PROXY_TARGET=http://catfish-api:3001
    depends_on:
      - catfish-api

  catfish-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catfish-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-catfish_user}:${POSTGRES_PASSWORD:-pU09OeG7qDthzND48JpKwc46rVtlCZM6}@postgres:5432/${POSTGRES_DB:-catfish_db}
      - CORS_ORIGIN=http://localhost:5173
      - APP_MASTER_ENCRYPTION_KEY=${APP_MASTER_ENCRYPTION_KEY:-B8edlMaWUgoma9CTGDN4RJpgH8SwiiLe}
      - JWT_SECRET=${JWT_SECRET:-4hWCrY96JBAJxcBsy8ph2s2KuGzaUho4}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: catfish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catfish_db}
      POSTGRES_USER: ${POSTGRES_USER:-catfish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pU09OeG7qDthzND48JpKwc46rVtlCZM6}
    ports:
      - "5432:5432"
    volumes:
      - catfish_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-catfish_user} -d ${POSTGRES_DB:-catfish_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  catfish_pgdata:
