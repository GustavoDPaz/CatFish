services:
  catfish-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catfish-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: catfish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catfish_db
      POSTGRES_USER: catfish_user
      POSTGRES_PASSWORD: catfish_secure_password
    ports:
      - "5432:5432"
    volumes:
      - catfish_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catfish_user -d catfish_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catfish_pgdata:
