services:
  catfish-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catfish-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=
    depends_on:
      - catfish-api

  catfish-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catfish-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://catfish_user:catfish_secure_password@postgres:5432/catfish_db
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: catfish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catfish_db
      POSTGRES_USER: catfish_user
      POSTGRES_PASSWORD: catfish_secure_password
    ports:
      - "5432:5432"
    volumes:
      - catfish_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U catfish_user -d catfish_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  catfish_pgdata:
